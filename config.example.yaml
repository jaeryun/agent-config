# Copy only when config.local.yaml does not exist. Private YAML/.local are ignored.
# OMP built-in names keep their native definitions; definition/tools.pi port them to pi.
# native/native preserves OMP routing and effort, not active-parent inheritance.
# Explicit provider/model + effort pins a worker without replacing its native prompt.
# Custom roles use inherit for parent model; custom OMP effort must be explicit.
# Optional extensions: {pi: ["./.local/my-browser-extension.ts"]} loads existing child tools.
# Pi concurrency is per-run. No repository-owned runner or global scheduler is installed.
version: 2
concurrency: 3
agents:
  orchestrator:
    description: Own request understanding, delegation, integration, and completion.
    definition: agent/AGENTS.md
    model: inherit
    effort: inherit
  task:
    description: General-purpose worker with full capabilities for delegated tasks.
    definition: agent/agents/task.md
    model: {omp: native, pi: inherit}
    effort: {omp: native, pi: inherit}
    spawns:
      pi: "*"
    tools:
      pi: [read, bash, edit, write, grep, find, ls]
  sonic:
    description: Apply an explicit mechanical transformation or collect bounded facts.
    definition: agent/agents/sonic.md
    model: {omp: native, pi: inherit}
    effort: {omp: native, pi: inherit}
    tools:
      pi: [read, bash, edit, write, grep, find, ls]
  scout:
    description: Explore an unmapped subsystem and return sourced findings without edits.
    definition: agent/agents/scout.md
    model: {omp: native, pi: inherit}
    effort: {omp: native, pi: inherit}
    tools:
      pi: [read, grep, find, ls]
  deep:
    description: Resolve ambiguous bugs and design-sensitive implementation end to end.
    definition: agent/agents/deep.md
    model: inherit
    effort: {omp: medium, pi: inherit}
    tools:
      omp: [read, grep, glob, bash, eval, edit, write, web_search]
      pi: [read, bash, edit, write, grep, find, ls]
  reviewer:
    description: Review correctness and compatibility with evidence-backed findings only.
    definition: agent/agents/reviewer.md
    model: {omp: native, pi: inherit}
    effort: {omp: native, pi: inherit}
    spawns:
      pi: [scout]
    tools:
      pi: [read, grep, find, ls, bash]
  security-reviewer:
    description: Review trust boundaries and report concrete security defects without edits.
    definition: agent/agents/security-reviewer.md
    model: {omp: native, pi: inherit}
    effort: {omp: native, pi: inherit}
    tools:
      pi: [read, grep, find, ls]
  image-analyst:
    description: Low-cost vision worker for image-heavy tasks, visual inspection, and non-vision model assistance using available tools.
    definition: agent/agents/image-analyst.md
    # Set an available lower-cost image-capable model before using cost-offload.
    # inherit is a neutral bootstrap choice, not a promise of cheaper or vision-capable execution.
    model: inherit
    effort: {omp: medium, pi: inherit}
    tools:
      omp: [read, eval, write]
      pi: [read, bash]
